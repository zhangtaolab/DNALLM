# PlantHelixSeek finetuned checkpoints (Phase 06-01 registry freeze, 2026-10-03).
# Label-order source: zhangtaolab/PlantHelixSeek GitHub,
#   scripts/gene_annotation/train_token_cls.py:78-96 (LABEL_NAMES), fetched 2026-10-02.
#   CRE class order: class-1 == CRE per upstream scripts/cis_regulatory/README.md
#   (bin score = arithmetic mean of class-1 probabilities).
# Checkpoint constraints proven by the one-shot freeze run: Anno config.id2label is
#   the 17-entry transformers identity-placeholder pattern and its classifier head is
#   [17, 512] with bias [17]; CRE config carries no id2label/label2id and its score
#   head is [2, 512] - the configs hold no label-ordering semantics, so the upstream
#   training script is the frozen semantic source (REG-02).
# Checkpoint commit shas (trust_remote_code provenance):
#   PlantHelixSeek-CRE  7093de3baf64bf59ac147be3971482a13238aabd
#   PlantHelixSeek-Anno 6d39386ab562b2a9a3d3581ebe28e235383c8d3c
# Freeze tooling is intentionally uncommitted (owner constraint 2026-10-02): it ran
#   once from the gitignored example/notebooks/plant_helixseek_shared/.scratch/ home.
  - name: "PlantHelixSeek CRE"
    model: "zhangtaolab/PlantHelixSeek-CRE"
    base_model: "zhangtaolab/PlantHelixSeek"
    task:
      describe: "Predict cis-regulatory elements (open chromatin) in plant genomes by using PlantHelixSeek model."
      task_type: "binary"
      num_labels: 2
      label_names: ["Not CRE", "CRE"]
      threshold: 0.5
  - name: "PlantHelixSeek Anno"
    model: "zhangtaolab/PlantHelixSeek-Anno"
    base_model: "zhangtaolab/PlantHelixSeek"
    task:
      describe: "Predict gene structure (CDS/intron/5'UTR/3'UTR) per nucleotide by using PlantHelixSeek model."
      task_type: "token"
      num_labels: 17
      label_names: ["O", "B-CDS", "I-CDS", "L-CDS", "U-CDS", "B-INTRON", "I-INTRON", "L-INTRON", "U-INTRON", "B-UTR5", "I-UTR5", "L-UTR5", "U-UTR5", "B-UTR3", "I-UTR3", "L-UTR3", "U-UTR3"]
      threshold: 0.5
# Registry enrichment: tokenizer_type / max_length (Phase 22-02, 2026-10-20).
# Method: one-time remote metadata probes — config.json / tokenizer_config.json only,
#   ModelScope first with HuggingFace fallback, no weights downloaded (D-01
#   probe-then-commit; re-probing reproduces these values remotely).
# Coverage rule (D-03): all zhangtaolab/* entries enriched mandatorily; third-party
#   entries best-effort — a gap is an absent key, never null/empty/zero.
# max_length rule (D-02): every pretrained entry carries max_length; finetuned entries
#   inherit via base_model resolved by the loader at query time — an explicit
#   finetuned max_length exists only where the measured value differs from the
#   base's, plus the 14 external-based plantcad repos whose bases sit outside
#   this registry.
# Probe and insertion tooling is intentionally uncommitted (gitignored .scratch/,
#   owner convention 2026-10-20).
# Registry compatibility census: tf_compat_status / tf_compat_evidence / tf_compat_tested (Phase 27-03, 2026-10-27).
# Method: import census plus sampled load/forward evidence under transformers
#   5.17.0 over all 49 pretrained entries; frozen evidence artifact:
#   tests/models/compat_census.json (27-02, dispositions complete).
# Coverage rule: all 49 pretrained entries carry the fields; finetuned entries
#   inherit from their bases and carry no tf_compat_* keys.
# tf_compat_tested records what was ACTUALLY tested: transformers 5.17.0 only.
#   The transformers 4 side is inferred (model code written in the transformers 4
#   era), never separately tested (D-05); inference wording is a docs-layer
#   concern (27-04).
# Tooling: scripts/census_compat.py --write-registry --apply (committed,
#   re-runnable; anchored text insertion only - never a YAML round-trip).
