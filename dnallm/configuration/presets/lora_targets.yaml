    match_names: [plant-dnabert]
    model_types: [bert]
    lora_target_modules: [query, value]
    ia3_target_modules: [key, value, intermediate.dense]
    feedforward_modules: [intermediate.dense]
    lora_r: 8
    ia3_ratio_band: [1.0e-4, 5.0e-3]
    lora_ratio_band: [5.0e-4, 3.0e-2]
    derivation: >-
      cached-remote: BertForMaskedLM transformers-native module names;
      band anchored on the measured plant-dnabert-BPE counts above.

