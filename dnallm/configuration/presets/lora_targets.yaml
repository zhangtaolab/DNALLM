# Per-family PEFT target-module presets (PEFT-02, REV-05).
#
# Resolution: when the lora:/ia3: config section carries target_modules=null,
# DNATrainer matches the live model against this table (name markers against
# the model's config._name_or_path first, then config.model_type), injects the
# preset lists, and logs "[Info] ... preset '<family>' selected ...". A model
# that matches no row raises a ValueError telling the user to set
# target_modules explicitly — never a silent fallback to guessed defaults.
#
# Field semantics per family row:
#   match_names          lowercase substrings matched against the load path /
#                        repo id (longest marker wins across families)
#   model_types          config.model_type values resolved to this row when no
#                        name marker matches (first PRETRAIN_MODEL_MAPS family
#                        of a shared model_type wins; shared rows carry
#                        identical module lists by construction)
#   lora_target_modules  LoRA targets (peft suffix matching)
#   ia3_target_modules   IA3 targets (attention key/value + FFN projections)
#   feedforward_modules  the FFN subset of ia3_target_modules (peft rescales
#                        these on the output side; MUST be a subset)
#   lora_r               recommended LoRA rank
#   ia3_ratio_band       [lo, hi] trainable-parameter fraction expected after
#   lora_ratio_band      get_peft_model, computed from requires_grad tensors;
#                        the D-04 guard raises when outside the band
#
# Derivation provenance (D-01: module names taken from real model code, not
# guessed; each row cites its source):
#   [cached-remote]  read from the modeling/config code shipped in the local
#                    HF/ModelScope snapshot cache this release was derived on
#   [config-fetch]   model_type/architectures read from the hub config.json
#                    (dev-time fetch, 2026-10-09)
#   [arch-canonical] canonical module names of the verified architecture
#                    class; run with finetune.peft_dry_run=true to confirm
#                    against the live backbone before training
#
# Ratio-band anchors measured empirically on the cached acceptance models
# (peft 0.21.1, task_type=SEQ_CLS, requires_grad tensor counts):
#   plant-dnabert-BPE (BERT, 768d/12L, 92.2M total):
#     IA3 [key, value, intermediate.dense]                29,186  -> 3.17e-4
#     LoRA r=8 [query, value]                            296,450  -> 3.22e-3
#   plant-dnamamba-BPE-open_chromatin (Mamba, 768d/24L, 96.7M total):
#     IA3 [in_proj, out_proj, x_proj, dt_proj]            133,251  -> 1.38e-3
#     LoRA r=8 [in_proj, x_proj, dt_proj]               1,353,987  -> 1.40e-2
#     (out_proj excluded from LoRA: peft rejects it on model_type=mamba)
#
# IA3 sizing rule (peft/tuners/ia3/layer.py update_layer): feedforward
# modules contribute in_features, attention modules out_features.

families:
