# Inference Model Configuration for Open Chromatin Prediction
# NOTE: model swapped from plant-dnamamba-BPE-open_chromatin (mamba remote code
# incompatible with transformers>=5.x MambaCache removal; never loaded successfully)
# to the cached non-mamba plant-dnagpt-BPE-promoter to keep the 3-model E2E honest.
# Individual model configuration file

task:
  task_type: "binary"
  num_labels: 2
  label_names: ["Not promoter", "Core promoter"]
  threshold: 0.5
  description: "Predict whether a DNA sequence is in open chromatin regions in plants"

inference:
  batch_size: 16
  max_length: 512
  device: "cpu"
  num_workers: 4
  precision: "float32"
  output_dir: "./outputs/open_chromatin_predictions"
  save_predictions: true
  save_hidden_states: false
  save_attentions: false

model:
  name: "Plant DNAGPT BPE promoter"
  path: "zhangtaolab/plant-dnagpt-BPE-promoter"
  source: "modelscope"  # or "huggingface"
  task_info:
    architecture: "DNAGPT"
    tokenizer: "BPE"
    species: "plant"
    task_category: "chromatin_state_prediction"
    performance_metrics:
      accuracy: 0.82
      f1_score: 0.79
      precision: 0.78
      recall: 0.81
