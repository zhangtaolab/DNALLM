name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
    # D-06: example-nightly stagger — 2.5h after the 03:00 UTC coverage
    # run, queue-serialized on the single dnallm-nightly runner (the
    # example-nightly job below carries its own event gate; the other
    # schedule-gated jobs fire per their own cron entries).
    - cron: "30 5 * * *"

# Least privilege: every job (including test jobs that run arbitrary test code
# and third-party actions) defaults to read-only. Only `deploy` overrides this
# below, because `mkdocs gh-deploy --force` pushes to the gh-pages branch.
permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }}, numpy${{ matrix.numpy-version }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        numpy-version: ['1.26.4', '2.2.0']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        # Hosted-runner optimization (removes Android/.NET images); pointless on
        # the self-hosted box and requires sudo the runner user lacks.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/.ghcup

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Create virtual environment and install dependencies
        env:
          UV_HTTP_TIMEOUT: 300
          UV_CONCURRENT_DOWNLOADS: 4
        run: |
          uv venv
          uv pip install -e ".[base]"

      - name: Install specific numpy version
        run: |
          source .venv/bin/activate
          if [ "${{ matrix.numpy-version }}" = "1.26.4" ]; then
            uv pip install "numpy==${{ matrix.numpy-version }}" "scipy>=1.15.2"
          elif [ "${{ matrix.numpy-version }}" = "2.2.0" ]; then
            uv pip install "numpy==${{ matrix.numpy-version }}"
          fi
          

      - name: Run linting and code quality checks with Ruff
        run: |
          source .venv/bin/activate
          # Check formatting
          ruff format --check .
          # Check linting
          ruff check . --statistics
          
      - name: Run fast tests
        run: |
          source .venv/bin/activate
          pytest -m "not slow" --cov --junitxml=pytest-junit.xml

      - name: Skip audit (unexpected skips fail the job)
        run: |
          source .venv/bin/activate
          python scripts/audit_skips.py pytest-junit.xml tests/expected_skips.yaml

      - name: Exit-code canary (a failing test must fail the job)
        run: |
          source .venv/bin/activate
          cat > tests/test_ci_exitcode_canary.py <<'CANARY'
          def test_ci_exitcode_canary():
              assert False, "intentional canary failure"
          CANARY
          if pytest tests/test_ci_exitcode_canary.py -q -p no:cacheprovider > canary.log 2>&1; then
            echo "CANARY FAILED: pytest exited 0 despite a failing test (exit-code mask regression)"
            cat canary.log
            rm tests/test_ci_exitcode_canary.py
            exit 1
          else
            echo "Canary OK: pytest exited non-zero as expected"
            cat canary.log | tail -5
            rm tests/test_ci_exitcode_canary.py
          fi

      - name: Run type checking
        run: |
          source .venv/bin/activate
          mypy dnallm/ --show-error-codes --pretty --exclude=dnallm/tasks/metrics/ || true
          
  test-windows:
    # Windows platform leg: the hosted matrix is linux-only today, yet the
    # package claims "Operating System :: OS Independent" and the primary dev
    # machine is Windows 11. Fast CPU leg only — the compiled mamba kernels
    # (.[mamba]) stay on the linux dnallm-nightly box.
    name: test-windows (py3.12)
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # root conftest prints emoji; non-UTF8 pipes on Windows would crash
      PYTHONUTF8: "1"
    steps:
      - name: Disable git autocrlf (keep LF endings for ruff format)
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Create virtual environment and install dependencies
        env:
          UV_HTTP_TIMEOUT: 300
          UV_CONCURRENT_DOWNLOADS: 4
        run: |
          uv venv
          uv pip install -e ".[base]"

      - name: Run linting and code quality checks with Ruff
        run: |
          source .venv/Scripts/activate
          # Check formatting
          ruff format --check .
          # Check linting
          ruff check . --statistics

      - name: Run fast tests
        run: |
          source .venv/Scripts/activate
          pytest -m "not slow" --cov --junitxml=pytest-junit.xml

      - name: Skip audit (unexpected skips fail the job)
        run: |
          source .venv/Scripts/activate
          python scripts/audit_skips.py pytest-junit.xml tests/expected_skips.yaml

      - name: Exit-code canary (a failing test must fail the job)
        run: |
          source .venv/Scripts/activate
          cat > tests/test_ci_exitcode_canary.py <<'CANARY'
          def test_ci_exitcode_canary():
              assert False, "intentional canary failure"
          CANARY
          if pytest tests/test_ci_exitcode_canary.py -q -p no:cacheprovider > canary.log 2>&1; then
            echo "CANARY FAILED: pytest exited 0 despite a failing test (exit-code mask regression)"
            cat canary.log
            rm tests/test_ci_exitcode_canary.py
            exit 1
          else
            echo "Canary OK: pytest exited non-zero as expected"
            cat canary.log | tail -5
            rm tests/test_ci_exitcode_canary.py
          fi

      - name: Run type checking
        run: |
          source .venv/Scripts/activate
          mypy dnallm/ --show-error-codes --pretty --exclude=dnallm/tasks/metrics/ || true

  test-cuda:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      matrix:
        python-version: ['3.11']
        cuda-version: ['12.1', '12.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        # Hosted-runner optimization (removes Android/.NET images); pointless on
        # the self-hosted box and requires sudo the runner user lacks.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/.ghcup

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nvidia-cuda-toolkit

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-cuda-${{ matrix.cuda-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-cuda-${{ matrix.cuda-version }}-
            ${{ runner.os }}-uv-

      - name: Create virtual environment and install CUDA dependencies
        env:
          UV_HTTP_TIMEOUT: 300
          UV_CONCURRENT_DOWNLOADS: 4
        run: |
          uv venv
          if [ "${{ matrix.cuda-version }}" = "12.1" ]; then
            uv pip install -e ".[base,cuda121]"
          elif [ "${{ matrix.cuda-version }}" = "12.4" ]; then
            uv pip install -e ".[base,cuda124]"
          fi
          
      - name: Run GPU-enabled tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v -m "not slow" --tb=short
          
  test-mamba:
    # Self-hosted GPU box on nightly cadence per GATE-02 (amended): the .[mamba]
    # install compiles mamba-ssm/causal_conv1d CUDA kernels from source, which
    # belongs to the nightly leg — push/PR stays the fast hosted leg.
    # schedule/dispatch-only preserves the coverage-nightly posture that PR code
    # (including forks) never executes on this runner. The gpu-check step below
    # stays as a fail-safe no-op if the box ever loses its GPU.
    runs-on: [self-hosted, dnallm-nightly]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # The recurring per-run CUDA kernel source build is the long pole
    # (--no-cache-dir plus a fresh uv venv per run bypass all wheel caching, so
    # the mamba-ssm/causal_conv1d compile repeats every run, not just the
    # first). 180min covers a worst-case GB10 build plus the .[base]
    # install plus the `not slow` census with headroom. Self-hosted jobs have
    # no platform time cap, so this backstop is the only protection against a
    # hung build monopolizing the single runner that also serves
    # coverage-nightly.
    timeout-minutes: 180
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for GPU
        id: gpu-check
        run: |
          if command -v nvidia-smi &> /dev/null && nvidia-smi > /dev/null 2>&1; then
            echo "has_gpu=true" >> $GITHUB_OUTPUT
            echo "GPU detected, will run mamba tests"
          else
            echo "has_gpu=false" >> $GITHUB_OUTPUT
            echo "No GPU detected, skipping mamba tests"
          fi

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.gpu-check.outputs.has_gpu == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        if: steps.gpu-check.outputs.has_gpu == 'true'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Create virtual environment and install mamba dependencies
        if: steps.gpu-check.outputs.has_gpu == 'true'
        # .[base] plus the fla extra, not .[test,dev]: the not-slow census
        # imports mcp-extra deps (langchain / langchain_mcp_adapters /
        # pydantic-ai / nest-asyncio in the mcp_example notebooks, and the
        # exceptiongroup backport at tests/mcp/test_client_sdk.py, pulled in
        # via pydantic-ai -> pydantic-ai-slim[mcp] -> fastmcp-slim[client]).
        # fla rides along (WR-01) so the not-slow chunk_kda import guard
        # actually exercises the import here instead of skipping typed; per
        # pyproject.toml:157 the bare fla spec rides the already-installed
        # torch/triton (no backend extras). Same extras set coverage-nightly
        # installs; it proves they resolve green on this exact box.
        run: |
          uv venv
          # pyBigWig sdist -lpython link fix (261004-dyw fallout, run
          # 37184990854): see the example-nightly stage-0 comment — sysconfig
          # bakes a nonexistent /opt/hostedtoolcache LIBDIR; point the linker
          # at the runner's real toolcache lib.
          export LDFLAGS="-L$(python -c 'import sys; print(sys.prefix)')/lib"
          uv pip install -e ".[base,fla]"
          uv pip install -e ".[mamba]" --no-cache-dir --no-build-isolation

      # No continue-on-error here: a failing mamba test must fail the job.
      # Hung runs are bounded by the per-test --timeout=300 from pytest addopts
      # and the 180-min job timeout; the artifact step below still fires via
      # steps.mamba-tests.outcome == 'failure'.
      - name: Run mamba-specific tests
        id: mamba-tests
        if: steps.gpu-check.outputs.has_gpu == 'true'
        run: |
          source .venv/bin/activate
          set -o pipefail
          pytest tests/ -v -m "not slow" --tb=short 2>&1 | tee pytest.log

      - name: Upload mamba test logs on failure
        if: always() && steps.mamba-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mamba-test-logs-${{ matrix.python-version }}
          path: |
            pytest.log
            /tmp/mamba-build.log

  coverage-gate:
    name: coverage-gate (py3.12, fast leg)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        # Hosted-runner optimization (removes Android/.NET images); pointless on
        # the self-hosted box and requires sudo the runner user lacks.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/.ghcup

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Create virtual environment and install dependencies
        env:
          UV_HTTP_TIMEOUT: 300
          UV_CONCURRENT_DOWNLOADS: 4
        run: |
          uv venv
          uv pip install -e ".[base]"

      - name: Install specific numpy version
        run: |
          source .venv/bin/activate
          uv pip install "numpy==2.2.0"

      - name: Run gated fast census (not slow)
        run: |
          source .venv/bin/activate
          .venv/bin/python -m pytest -m "not slow" -ra --durations=0 --junitxml=pytest-junit-gate.xml --cov -p no:cacheprovider -p no:progress

      - name: Skip audit (gated junit)
        run: |
          source .venv/bin/activate
          python scripts/audit_skips.py pytest-junit-gate.xml tests/expected_skips.yaml

  coverage-nightly:
    name: coverage-nightly (py3.12, full suite incl. slow)
    # Self-hosted GPU box (aarch64, warm HF/ModelScope caches in $HOME):
    # schedule/dispatch events only — fork PRs can never land here; all PR jobs
    # stay on hosted runners. Hosted runners cap at 360min (run 36747594207 was
    # killed at exactly 6h00m33s), which a CPU census cannot fit (13x GPU->CPU).
    runs-on: [self-hosted, dnallm-nightly]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Per-test timeout ceilings across the census sum to 840min (7 phase marks
    # = 600min + download/real-inference/MCP marks = 900+900+5x1800+3600s =
    # 240min; the 1800s class mark on TestRealModelInference applies to all 5
    # of its items). Keep the job kill at 900, above that sum, so a hung test
    # fails via its own mark (junit + skip audit still run) instead of a job
    # kill (no junit, model-cache forfeit). NOTE: GitHub-hosted runners
    # hard-cap a single job at 360min, so the platform cap binds before both
    # numbers; the per-test marks are the primary protection and these
    # job-level figures are backstops.
    timeout-minutes: 900
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        # Hosted-runner optimization (removes Android/.NET images); pointless on
        # the self-hosted box and requires sudo the runner user lacks.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/.ghcup

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Restore model caches (keyed on models.lock)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/modelscope/hub
          key: ${{ runner.os }}-models-${{ hashFiles('models.lock') }}
          restore-keys: |
            ${{ runner.os }}-models-

      - name: Create virtual environment and install dependencies
        env:
          UV_HTTP_TIMEOUT: 300
          UV_CONCURRENT_DOWNLOADS: 4
        run: |
          uv venv
          # pyBigWig sdist -lpython link fix (261004-dyw fallout, run
          # 37184990854): see the example-nightly stage-0 comment — sysconfig
          # bakes a nonexistent /opt/hostedtoolcache LIBDIR; point the linker
          # at the runner's real toolcache lib.
          export LDFLAGS="-L$(python -c 'import sys; print(sys.prefix)')/lib"
          # fla included (WR-01): this is the only leg running the full suite
          # with the two slow PlantHelixSeek checkpoint smokes — without fla
          # those loads exercise the remote code's silent non-KDA fallback.
          uv pip install -e ".[base,fla]"

      - name: Install specific numpy version
        run: |
          source .venv/bin/activate
          uv pip install "numpy==2.2.0"

      # NOTE: 27 tests carry the slow mark; 21 execute here. The 6 MCP
      # live-server probes (dnallm/mcp/tests/test_sse_client.py,
      # test_streamable_http_client.py) target localhost:8000 and no CI job
      # starts a server there, so they skip deterministically as typed
      # "network-unavailable:" skips (allowlisted in tests/expected_skips.yaml).
      # Those probes are local-only.
      - name: Run gated full census (slow included)
        run: |
          source .venv/bin/activate
          .venv/bin/python -m pytest -ra --durations=0 --junitxml=pytest-junit-nightly.xml --cov -p no:cacheprovider -p no:progress

      - name: Skip audit (nightly junit)
        run: |
          source .venv/bin/activate
          python scripts/audit_skips.py pytest-junit-nightly.xml tests/expected_skips.yaml

  example-nightly:
    name: example-nightly (py3.12, example execution census)
    # D-05 (owner-rated costly to reverse): the example-execution nightly
    # runs in its OWN job, pre-authorized by CI-06 once the example census
    # outgrew the coverage-nightly budget — nightly time budgets and the
    # stage-ordering conventions below must be re-planned together to ever
    # merge it back into coverage-nightly.
    # D-06: scheduled 05:30 UTC — 2.5h after coverage-nightly's 03:00 UTC
    # start, queue-serialized on the single dnallm-nightly runner so GPU
    # and disk bandwidth are never contended.
    runs-on: [self-hosted, dnallm-nightly]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # D-07 staged-serial ordering contract (VRAM/port coexistence, MCP-02):
    #   stage 0    install + shared caches + runner-inventory probes
    #   stage 1    torch-heavy example execution FIRST (ACTIVE notebooks +
    #              showcase + marimo + script lane + YAML leg; the two
    #              mcp_example ids are deselected — they belong to stage 2)
    #   stage 1.5  kernel pkill + VRAM settle before any server-binding stage
    #   stage 2    MCP live-server probes on :8000 (wired in 08-09: 3
    #              streamable-http probes, sse restart, 3 sse probes)
    #   stage 2.5  kernel pkill + VRAM settle before the ollama batch
    #   stage 3    ollama batch LAST (wired in 08-09: fresh streamable-http
    #              server + the two mcp_example ids; D-13 probe in-gate)
    #   stage 4    junit skip audit + artifact upload + fail-soft summary
    # Stages run serially inside one job by design; a server-binding stage
    # may never start while the previous stage still holds GPU memory or
    # kernel processes.
    # Sum-of-ceilings backstop (same discipline as coverage-nightly): the
    # per-test pytest-timeout marks across tests/examples sum to ~2620 min
    # (ACTIVE 13x7200s + gated non-mcp 5x3600-7200s + marimo 3x7200s +
    # showcase 2400+5400+2400s + script 3600s + fast contract tests), so
    # the per-test marks are the primary hang protection; the job kill
    # sits above that sum. Self-hosted jobs have no platform time cap —
    # this backstop is the only whole-job bound.
    # D-08 fail-soft: every stage-1+ invocation records its exit code to
    # stage-results.txt and its step exits 0 so later stages still run; the
    # stage-4 summary exits non-zero when ANY recorded outcome failed. NO
    # step in this job carries continue-on-error — a forever-green job is
    # prohibited, and an infra failure in stage 0 still fails the job
    # directly (nothing downstream can run without a venv).
    # Measured dev-box actuals (08-03/08-05/08-07/08-08 family SUMMARYs):
    # full examples lane ~2h35m wall (08-08 chunked census 41+6+149 items),
    # megaDNA family lane 48:05, evo lane 49s (offline giants), lora pair
    # ~11 min, mcp pair ~25 min, fast YAML leg seconds. First dispatch of
    # the 08-01 skeleton measured 66 min end-to-end (stage 1 only, typed
    # skips for the then-gated families) — the completed job adds the
    # gated-family executions plus a one-time flash-attn/mamba wheel build
    # (~50 + ~40-90 min, wheel-cached afterward) and the 12.9GB giants
    # prefetch (one-time), so first-run totals land well under this
    # backstop while steady-state runs track the dev-box actuals.
    timeout-minutes: 2700
    env:
      # Network reality on the dnallm-nightly box (08-08 lora repair
      # finding): huggingface.co is unreachable while hf-mirror.com — the
      # endpoint dnallm's own use_mirror toggle installs — serves the same
      # artifacts. Pinned job-wide so cold hub fetches (giants prefetch
      # included) cannot dead-wait on the unreachable origin.
      HF_ENDPOINT: https://hf-mirror.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Restore model caches (keyed on models.lock)
        # D-09: EXACT coverage-nightly key — read-only reuse of the shared
        # hub cache (identical key = cache hit, no save churn competing
        # with the coverage run). Giant-model tiers stay out of this cache
        # (D-13).
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/modelscope/hub
          key: ${{ runner.os }}-models-${{ hashFiles('models.lock') }}
          restore-keys: |
            ${{ runner.os }}-models-

      - name: "Stage 0: create venv and install full extras (D-10)"
        env:
          UV_HTTP_TIMEOUT: 300
          UV_CONCURRENT_DOWNLOADS: 4
        run: |
          uv venv
          # pyBigWig (pulled by pygenometracks in the notebook extra since
          # 261004-dyw) builds from sdist on aarch64 — no arm64 wheels —
          # and its extension links -lpython against the LIBDIR the
          # python-versions build baked into sysconfig
          # (/opt/hostedtoolcache/...), which does not exist on this
          # self-hosted box (run 37184990854: ld "cannot find
          # -lpython3.12"). The runner's real toolcache ships
          # libpythonX.Y.so — point the linker at sys.prefix/lib (rootless,
          # version-agnostic; proven green on this box).
          export LDFLAGS="-L$(python -c 'import sys; print(sys.prefix)')/lib"
          # D-10 full extras: base (dev/test/notebook/mcp transitive),
          # fla (PlantHelixSeek KDA kernels), dev (pyfastx/pybedtools for
          # the script lane), mcp (server stack for stage 2). System
          # binaries such as bedtools are handled by the rootless
          # install/fallback step below (08-09, D-10's job-step clause).
          uv pip install -e ".[base,fla,dev,mcp]"
          : > stage-results.txt

      - name: Cache bedtools rootless prefix
        uses: actions/cache@v4
        with:
          path: .bedtools-env
          key: bedtools-bioconda-${{ runner.os }}-${{ runner.arch }}

      - name: "Stage 0: bedtools rootless install/fallback (D-10, A10)"
        # Rootless posture (research Pitfall 5): the runner user has no
        # sudo, so bedtools comes from micromamba/bioconda into a job-local
        # prefix (cached across runs) when the box does not already ship
        # the binary. The prefix goes onto PATH via GITHUB_PATH so the
        # script lane's pybedtools finds it — never apt, never sudo.
        run: |
          if command -v bedtools; then
            echo "bedtools already on PATH: $(command -v bedtools)"
            exit 0
          fi
          if [ -x .bedtools-env/bin/bedtools ]; then
            echo "$GITHUB_WORKSPACE/.bedtools-env/bin" >> "$GITHUB_PATH"
            echo "bedtools restored from cached prefix: $(.bedtools-env/bin/bedtools --version)"
            exit 0
          fi
          echo "bedtools absent — rootless micromamba/bioconda install (no sudo)"
          curl -Ls "https://micro.mamba.pm/api/micromamba/linux-$(uname -m)/latest" \
            | tar -xj -C "$RUNNER_TEMP" bin/micromamba
          "$RUNNER_TEMP/bin/micromamba" create -y -p "$GITHUB_WORKSPACE/.bedtools-env" \
            -c conda-forge -c bioconda bedtools
          echo "$GITHUB_WORKSPACE/.bedtools-env/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.bedtools-env/bin:$PATH"
          command -v bedtools && bedtools --version \
            || { echo "bedtools still missing after rootless fallback"; exit 1; }

      - name: "Stage 0: evo isolated venv — FEASIBILITY-locked stack (gated-family prereq)"
        # D-10 job-step clause; NEVER a pyproject extra (05-FEASIBILITY
        # lock). The evo notebook's dnallm-evo-kernel lane probes
        # .scratch/evo-venvs/evo for stripedhyena + evo2 + flash_attn
        # (evo_prerequisites_installed, 08-06) — this step provisions that
        # venv, mirroring the dev-box venv the 08-07 census executed
        # green: dnallm[cuda130] + ipykernel, stripedhyena 0.2.2 pinned
        # first (--no-deps so the resolver cannot float it), evo-model 0.5
        # with deps (brings biopython), evo2==0.3.0 + vtx 1.1.0.
        # transformer-engine stays DELIBERATELY absent (05-FEASIBILITY:
        # the empty TE meta package raises at import in a way that escapes
        # vortex's ImportError guard) — asserted below.
        run: |
          EVO_PY=.scratch/evo-venvs/evo/bin/python
          mkdir -p .scratch/evo-venvs
          uv venv .scratch/evo-venvs/evo --python .venv/bin/python
          uv pip install --python "$EVO_PY" -e ".[cuda130]" ipykernel
          uv pip install --python "$EVO_PY" "stripedhyena==0.2.2" --no-deps
          uv pip install --python "$EVO_PY" "evo-model==0.5"
          uv pip install --python "$EVO_PY" "evo2==0.3.0" "vtx==1.1.0"
          if "$EVO_PY" -c "import transformer_engine" 2>/dev/null; then
            echo "FATAL: transformer_engine present in the evo venv — FEASIBILITY requires it absent"
            exit 1
          fi
          echo "evo stack installed (flash-attn lands via the wheelhouse step below)"

      - name: "Stage 0: capture wheel-cache key versions"
        id: wheelkeys
        run: |
          {
            echo "torch=$(.venv/bin/python -c 'import torch; print(torch.__version__)')"
            echo "evo_torch=$(.scratch/evo-venvs/evo/bin/python -c 'import torch; print(torch.__version__)')"
          } >> "$GITHUB_OUTPUT"

      - name: Cache flash-attn wheelhouse (evo venv)
        # ~50-min sm_120 source build happens ONCE; the built wheel is
        # cached keyed on package version + arch + the evo venv's torch
        # build (the extension links against torch's C ABI).
        uses: actions/cache@v4
        with:
          path: wheelhouse-flashattn
          key: flashattn-2.8.3.post1-${{ runner.arch }}-torch${{ steps.wheelkeys.outputs.evo_torch }}

      - name: "Stage 0: build/install flash-attn (cached wheelhouse, evo venv)"
        run: |
          if ! ls wheelhouse-flashattn/flash_attn-*.whl >/dev/null 2>&1; then
            mkdir -p wheelhouse-flashattn
            EVO_PY=.scratch/evo-venvs/evo/bin/python
            uv pip install --python "$EVO_PY" pip
            FLASH_ATTN_CUDA_ARCHS="120" MAX_JOBS=8 \
              "$EVO_PY" -m pip wheel "flash-attn==2.8.3.post1" \
                --no-build-isolation --no-cache-dir -w wheelhouse-flashattn
          fi
          uv pip install --python .scratch/evo-venvs/evo/bin/python wheelhouse-flashattn/flash_attn-*.whl
          .scratch/evo-venvs/evo/bin/python -c "import stripedhyena, evo2, flash_attn; print('evo gate probe: GREEN')"

      - name: Cache mamba kernel wheelhouse (project venv)
        uses: actions/cache@v4
        with:
          path: wheelhouse-mamba
          key: mamba-conv1d-1.7.0-ssm-2.3.2.post1-${{ runner.arch }}-torch${{ steps.wheelkeys.outputs.torch }}

      - name: "Stage 0: build/install mamba kernels (cached wheelhouse, project venv)"
        # Cached-wheelhouse variant of the test-mamba install flags
        # (--no-build-isolation source compile): the lora pair's _gate_mamba
        # probes mamba_ssm in the RUNNING interpreter, so the kernels land
        # in the project venv (08-08 dev-box precedent). Versions mirror
        # the pyproject mamba extra pins.
        run: |
          if ! ls wheelhouse-mamba/causal_conv1d-*.whl wheelhouse-mamba/mamba_ssm-*.whl >/dev/null 2>&1; then
            mkdir -p wheelhouse-mamba
            uv pip install --python .venv/bin/python pip
            .venv/bin/python -m pip wheel "causal_conv1d==1.7.0" "mamba-ssm==2.3.2.post1" \
              --no-build-isolation --no-cache-dir -w wheelhouse-mamba
          fi
          uv pip install wheelhouse-mamba/causal_conv1d-*.whl wheelhouse-mamba/mamba_ssm-*.whl

      - name: "Stage 0: megaDNA pinned clone + isolated venv + project-venv siblings"
        # FEASIBILITY-locked pins (research): finetune_generation's
        # dnallm-megadna kernel probes .scratch/megadna-venvs/megadna for
        # megaDNA + MEGABYTE_pytorch==0.2.1 (megadna_prerequisites_installed);
        # the two read-only siblings probe the PROJECT venv (_gate_megadna),
        # so the pinned pair installs into both (08-05 reversible sibling
        # install). Clone is checked out at exactly cb2f5ab4 — never
        # floating. Mirrors ensure_megadna_kernel's own recipe.
        run: |
          MGD_PY=.scratch/megadna-venvs/megadna/bin/python
          mkdir -p .scratch/megadna-venvs
          uv venv .scratch/megadna-venvs/megadna --python .venv/bin/python
          uv pip install --python "$MGD_PY" -e ".[cuda130]" ipykernel pyfastx
          if [ ! -d .scratch/megadna-venvs/megadna-clone-src ]; then
            git clone https://github.com/lingxusb/megaDNA.git .scratch/megadna-venvs/megadna-clone-src
          fi
          git -C .scratch/megadna-venvs/megadna-clone-src checkout cb2f5ab4cc88dc0effe05c5f23358862c837014a
          uv pip install --python "$MGD_PY" "MEGABYTE_pytorch==0.2.1" .scratch/megadna-venvs/megadna-clone-src
          uv pip install "MEGABYTE_pytorch==0.2.1" .scratch/megadna-venvs/megadna-clone-src
          "$MGD_PY" -c "import megaDNA, MEGABYTE_pytorch; print('megadna gate probe: GREEN')"

      - name: "Stage 0: evo-1 giants prefetch (safetensors-only → ~/models-giants, D-14/CI-05)"
        # The 12.913GB safetensors set (never the 16.81GB pytorch_model.pt)
        # lands in ~/models-giants — OUTSIDE every actions/cache path, so
        # it can never evict the 10GB-quota hub cache. The evo notebook's
        # spec env points HF_HUB_CACHE here and runs HF_HUB_OFFLINE=1
        # (08-06 lane); dnallm's allow_patterns passthrough (08-03) keeps
        # load-time fetches safetensors-only, so nothing re-pulls the .pt.
        # HF_ENDPOINT comes from the job env (hf-mirror; origin unreachable).
        run: |
          .venv/bin/python -c "
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              'togethercomputer/evo-1-8k-base',
              revision='a9be7b66485080893399ade87c7d34f81ad3e249',
              allow_patterns=['*.safetensors', '*.json', '*.txt', 'README.md'],
              cache_dir=os.path.expanduser('~/models-giants/hub'),
          )
          print('giants prefetch complete')
          "

      - name: "Stage 0: runner inventory probe (A1/A10/A11)"
        # T-08-03: echoes only command locations, disk totals, GPU totals,
        # and HTTP status codes — never env dumps or credentials.
        run: |
          echo "--- disk (home) ---"
          df -h ~ || true
          echo "--- gpu ---"
          nvidia-smi --query-gpu=name,memory.total --format=csv || echo "nvidia-smi MISSING"
          echo "--- hf-mirror reachability ---"
          curl -sS -m 5 -o /dev/null -w "hf-mirror.com HTTP %{http_code}\n" https://hf-mirror.com || echo "hf-mirror.com UNREACHABLE (exit $?)"

      - name: "Stage 1: torch-heavy example execution (ACTIVE + showcase + marimo + script + YAML leg)"
        # D-08 fail-soft: each invocation records its exit code and the
        # step exits 0 so stages 1.5-4 still run; the stage-4 summary
        # carries the non-zero verdict when anything failed.
        run: |
          set +e
          .venv/bin/python -m pytest tests/examples -q --junitxml=pytest-junit-example-stage1.xml -k "not mcp_example" -m "not giants"
          rc=$?
          echo "stage1-examples=$rc" >> stage-results.txt
          .venv/bin/python -m pytest tests/configuration/test_yaml_load.py -q --junitxml=pytest-junit-yaml-stage1.xml
          rc=$?
          echo "stage1-yaml=$rc" >> stage-results.txt
          exit 0

      - name: "Stage 1.5: kernel cleanup + VRAM settle (D-07)"
        # Explicit VRAM/process cleanup between the torch-heavy stage and
        # any server-binding stage: stray ipykernel children are killed
        # before GPU memory is expected to settle.
        run: |
          pkill -f ipykernel_launcher || true
          sleep 5
          nvidia-smi --query-gpu=memory.used,memory.total --format=csv || echo "nvidia-smi MISSING (VRAM settle unverified)"

      # ── Stage 2: MCP live-server probes on :8000 ──────────────────────
      # D-07 contract (module comments in tests/examples/
      # test_notebook_execution.py): start the dnallm MCP server on :8000
      # (yaml host/port — the CLI --host/--port flags are dead), run the 6
      # live-server probes. The two transports need their own server
      # instance (one :8000 server at a time — 08-08 finding): 3
      # streamable-http probes, restart in sse, 3 sse probes, stop.
      # Readiness window: the server eagerly loads its 3 configured models
      # at startup (minutes from a warm cache), so the poll allows ~15 min.
      - name: "Stage 2: MCP live-server probes — streamable-http (D-07)"
        run: |
          set +e
          .venv/bin/dnallm-mcp-server --config dnallm/mcp/configs/mcp_server_config.yaml \
            --transport streamable-http > mcp-server-streamable.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 90); do
            curl -s -o /dev/null -m 2 http://localhost:8000/mcp && break
            sleep 10
          done
          if curl -s -o /dev/null -m 2 http://localhost:8000/mcp; then
            .venv/bin/python -m pytest dnallm/mcp/tests/test_streamable_http_client.py -q \
              --junitxml=pytest-junit-mcp-stage2-streamable.xml
            echo "stage2-mcp-probes-streamable=$?" >> stage-results.txt
          else
            echo "MCP server (streamable-http) never became ready — see mcp-server-streamable.log"
            echo "stage2-mcp-probes-streamable=1" >> stage-results.txt
          fi
          kill $SERVER_PID 2>/dev/null; wait $SERVER_PID 2>/dev/null || true
          exit 0

      - name: "Stage 2: MCP live-server probes — sse (server restarted, one transport at a time)"
        run: |
          set +e
          .venv/bin/dnallm-mcp-server --config dnallm/mcp/configs/mcp_server_config.yaml \
            --transport sse > mcp-server-sse.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 90); do
            curl -s -o /dev/null -m 2 http://localhost:8000/sse && break
            sleep 10
          done
          if curl -s -o /dev/null -m 2 http://localhost:8000/sse; then
            .venv/bin/python -m pytest dnallm/mcp/tests/test_sse_client.py -q \
              --junitxml=pytest-junit-mcp-stage2-sse.xml
            echo "stage2-mcp-probes-sse=$?" >> stage-results.txt
          else
            echo "MCP server (sse) never became ready — see mcp-server-sse.log"
            echo "stage2-mcp-probes-sse=1" >> stage-results.txt
          fi
          kill $SERVER_PID 2>/dev/null; wait $SERVER_PID 2>/dev/null || true
          exit 0

      - name: "Stage 2.5: kernel cleanup + VRAM settle (D-07, pre-ollama)"
        # Explicit cleanup before the ollama batch: stray ipykernel
        # children die, GPU memory settles before qwen3.8's 17GB weights
        # come under load in stage 3.
        run: |
          pkill -f ipykernel_launcher || true
          sleep 5
          nvidia-smi --query-gpu=memory.used,memory.total --format=csv || echo "nvidia-smi MISSING (VRAM settle unverified)"

      # ── Stage 3: ollama batch ──────────────────────────────────────────
      # D-07 ordering: ollama runs last so its daemon never coexists with
      # the stage-1 GPU load. The D-13 readiness probe (~60s retry window
      # over 127.0.0.1:11434/api/tags) lives INSIDE the gate
      # (_gate_ollama_stack) — ollama itself is the owner-enabled systemd
      # unit (scripts/runner/README.md); when it is down the pair degrades
      # honestly to network-unavailable typed skips carrying both probe
      # results. The MCP server must be UP here too (the notebooks' gate
      # probes :8000/mcp), so stage 3 starts a fresh streamable-http
      # instance — the D-07 architecture keeps exactly one :8000 server at
      # a time and stops it after the pair.
      - name: "Stage 3: mcp pair (ollama + MCP server up, D-13 probe in the tests)"
        run: |
          set +e
          .venv/bin/dnallm-mcp-server --config dnallm/mcp/configs/mcp_server_config.yaml \
            --transport streamable-http > mcp-server-stage3.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 90); do
            curl -s -o /dev/null -m 2 http://localhost:8000/mcp && break
            sleep 10
          done
          if curl -s -o /dev/null -m 2 http://localhost:8000/mcp; then
            .venv/bin/python -m pytest tests/examples/test_notebook_execution.py -k "mcp_example" -q -rs \
              --junitxml=pytest-junit-mcp-stage3.xml
            echo "stage3-mcp-pair=$?" >> stage-results.txt
          else
            echo "MCP server (stage 3) never became ready — see mcp-server-stage3.log"
            echo "stage3-mcp-pair=1" >> stage-results.txt
          fi
          kill $SERVER_PID 2>/dev/null; wait $SERVER_PID 2>/dev/null || true
          pkill -f ipykernel_launcher || true
          exit 0

      - name: "Stage 4: junit skip audits (fail-soft)"
        if: always()
        run: |
          set +e
          for junit in pytest-junit-example-stage1.xml pytest-junit-yaml-stage1.xml \
            pytest-junit-mcp-stage2-streamable.xml pytest-junit-mcp-stage2-sse.xml \
            pytest-junit-mcp-stage3.xml; do
            if [ -f "$junit" ]; then
              .venv/bin/python scripts/audit_skips.py "$junit" tests/expected_skips.yaml
              echo "stage4-audit-$junit=$?" >> stage-results.txt
            else
              echo "stage4-audit-$junit=1 (junit missing: pytest never wrote it)" >> stage-results.txt
            fi
          done
          exit 0

      - name: "Stage 4: upload junit artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-nightly-junit
          path: |
            pytest-junit-*.xml
            mcp-server-*.log

      - name: "Stage 4: fail-soft summary (D-08)"
        if: always()
        run: |
          echo "--- example-nightly stage results ---"
          if [ ! -f stage-results.txt ]; then
            echo "stage-results.txt missing: stage 0 failed before any stage recorded an outcome"
            exit 1
          fi
          cat stage-results.txt
          if grep -qE '=[1-9][0-9]*$' stage-results.txt; then
            echo "FAIL: at least one stage item exited non-zero (D-08: this job may never be forever-green)"
            exit 1
          fi
          echo "OK: every recorded stage item exited 0"

  deploy:
    # test-mamba removed from needs: it is event-gated to schedule/dispatch, so
    # on every push it is skipped — GitHub skips dependents of skipped needs,
    # which would silently stop gh-pages deploys on push to main/master.
    needs: [test, test-cuda]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure Git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
          
      - name: Cache mkdocs dependencies
        uses: actions/cache@v3
        with:
          key: mkdocs-material-${{ github.run_number }}
          path: .cache
          restore-keys: |
            mkdocs-material-
            
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        
      - name: Create virtual environment and install documentation dependencies
        env:
          UV_HTTP_TIMEOUT: 120
          UV_CONCURRENT_DOWNLOADS: 1
        run: |
          uv venv
          uv pip install -e ".[base,docs]"
          
      - name: Deploy documentation to GitHub Pages
        run: |
          source .venv/bin/activate
          mkdocs gh-deploy --force
