[project]
name = "dnallm"
version = "1.3.0"
description = "A comprehensive toolkit for fine-tuning and inference with DNA Language Models"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["dna", "language-model", "bioinformatics", "machine-learning", "genomics"]
authors = [
    {name = "Zhangtaolab", email = "forrest_zhang@163.com"}
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "accelerate>=1.4.0",
    "addict>=2.4.0",
    "altair[all]>=5.5.0",
    "bitsandbytes>=0.43.0",
    "captum>=0.7.0",
    "colorama>=0.4.6",
    "datasets<=5.1.0",
    "einops>=0.7.0",
    "evaluate>=0.4.3",
    "huggingface-hub>=0.29.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8",
    "aiohttp>=3.9.0",
    "jax>=0.5.2",
    "loguru>=0.7.0",
    "mambapy>=1.2.0",
    "mcp>=1.3.0,<2",
    "modelscope[framework]>=1.23.2",
    "oss2>=2.18.0",
    "nbstripout>=0.8.1",
    "ninja>1",
    "numba>0.56.2",
    # numpy 1.x retired 2026-10-10; 1.x users stay on the 0.8.x series
    "numpy>=2.0.0",
    "optuna>=3.6.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "peft>=0.14.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "scikit-allel>=1.3.13,<2",
    "scikit-learn>=1.4.0",
    "scipy>=1.15.2",
    "sentencepiece>=0.2.0",
    "seqeval>=1.2.2",
    "starlette>=0.40.0,<1.8.0",
    "tensorboardx>=2.6.2.2",
    "tokenizers>=0.21.0",
    "torch>=2.4.0,<2.12",
    "tqdm>=4.67.1",
    "transformers>=4.49.0,<6",
    "umap-learn>=0.5.7",
    "uvicorn>=0.24.0",
    "wandb>=0.19.8",
    "websockets>=12.0",
    "wheel>=0.45.0",
]

[project.urls]
Homepage = "https://github.com/zhangtaolab/DNALLM"
Repository = "https://github.com/zhangtaolab/DNALLM"
Documentation = "https://zhangtaolab.github.io/DNALLM/"
"Bug Tracker" = "https://github.com/zhangtaolab/DNALLM/issues"

[project.optional-dependencies]
dev = [
    "dnallm[test,notebook]",
    "ruff==0.16.10",
    "pre-commit>=3.6.0",
    "logomaker>=0.8.2",
    "pybedtools>=0.11.0; platform_system != 'Windows'",
    "pyfastx>=2.2.0",
    "seaborn>=0.13.0",
]
test = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
    "pytest-progress>=0.1.0",
    "pytest-timeout>=2.3.1,<2.5",
    "coverage[toml]>=7.10.6",
    "nbclient>=0.10",
]
notebook = [
    "jupyter>=1.1.1",
    "marimo>=0.16.3",
    "nbclient>=0.10",
    # REPAIR-01 (08-02): pygenometracks>=3.9 pins matplotlib<3.9, whose
    # install_repl_displayhook imports IPython.core.pylabtools.backend2gui
    # unguarded -- removed in IPython 9. Under ipython 9.x the first
    # plt.subplots in every notebook kernel dies with ImportError. Floor
    # 8.31 = first IPython 8 with Python 3.13 support (CI matrix).
    "ipython>=8.31,<9",
    # GPL-3.0: explicit owner override (2026-10-04) for the example showcase
    # notebooks' zoom/combined figures; dnallm package code never imports it.
    # Windows-excluded (2026-10-07): pgt pulls pybigwig, which has no Windows
    # wheel and whose sdist setup.py dies with AttributeError 'NoneType' object
    # has no attribute 'split' on the test-windows .[full] install; dnallm never
    # imports pgt, so omitting it on Windows is behavior-safe.
    "pygenometracks>=3.9; platform_system != 'Windows'",
]
docs = [
    "mkdocs-jupyter>=0.24.0",
    "mkdocs-material>=9.6.1",
    "mkdocstrings-python>=1.16.10",
    "click<8.5.1",
]
ui = [
    "gradio>=4.0.0",
]
mcp = [
    "mcp>=1.0.0,<2",
    "langchain>=1.3.6",
    "langchain_mcp_adapters>=0.2.1",
    # REPAIR-04 (08-01): the langchain mcp notebook's ollama cell runs
    # langchain_ollama.ChatOllama; floor pinned to the notebook's verified
    # installed version. Supplements -- never replaces -- the isolated
    # dnallm-mcp-langchain kernelspec venv isolation.
    "langchain-ollama>=1.1.0",
    "nest-asyncio>=1.5.9",
    # 2026-10-10: floor at the 1.107 series. Under the previous <3 (then
    # >=1.3.6,<2) bounds, uv silently backtracked fresh CI resolves to
    # pydantic-ai 1.22.0, whose messages.py hard-imports opentelemetry._events
    # (absent from the resolved otel set) and broke the pydantic_ai notebook
    # import. 1.107.x is the dev-green series; if a transitive constraint
    # rejects it, resolution now fails LOUDLY naming the capper instead of
    # landing on the broken 1.22.
    "pydantic-ai>=1.107.0,<2",
]
full = [
    "dnallm[dev,test,notebook,mcp]",
    "isort>=6.0.1",
]
# Deprecated one-cycle alias (owner 2026-10-14): base was renamed to full in
# v1.3; this alias still installs the full set (no silent under-install).
# Remove in v1.4 -- pip/uv then only warn that the extra does not exist and
# exit 0, leaving a core-only under-install (which this cycle prevents).
base = [
    "dnallm[full]",
]
all = [
    "dnallm[full,dev,test,notebook,docs,ui,mcp,fla]",
]
cpu = [
    "torch>=2.4.0,<2.12",
]
cuda124 = [
    "torch>=2.4.0,<2.12",
]
cuda126 = [
    "torch>=2.6.0,<2.12",
]
cuda128 = [
    "torch>=2.6.0,<2.12",
]
cuda130 = [
    "torch>=2.9.0,<2.12",
]
mamba = [
    "causal_conv1d==1.7.0",
    "mamba-ssm==2.3.2.post1",
    "torch>=2.6.0,<2.12",
]
# KDA kernels for PlantHelixSeek remote code (HelixSeekDelta layers). Bare install:
# rides the already-installed torch/triton — do NOT use fla's own backend extras
# ([cuda]/[rocm]), they pin their own torch and would downgrade this environment.
fla = [
    "flash-linear-attention>=0.5.2,<0.6",
    # WPAR-07 (18-01): torch Windows wheels declare no triton, but fla's
    # fla.ops.* kernels need it -- declare the triton-lang-org fork wheel,
    # Windows-only, exact band (no floating). Linux resolvers see the marker
    # evaluate false and never pull it.
    "triton-windows>=3.7.1.post27,<3.8; platform_system == 'Windows'",
]

#mamba = [
#    "mamba-ssm>=2.2",
#    "causal_conv1d>=1.4",
#]


[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cuda124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "torch-cuda126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "torch-cuda128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "torch-cuda130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "torch-cpu", extra = "cpu" },
  { index = "torch-cuda124", extra = "cuda124" },
  { index = "torch-cuda126", extra = "cuda126" },
  { index = "torch-cuda128", extra = "cuda128" },
  { index = "torch-cuda130", extra = "cuda130" },
]

[tool.uv]
conflicts = [
  [ { extra = "cpu" }, { extra = "cuda124" } ],
  [ { extra = "cpu" }, { extra = "cuda126" } ],
  [ { extra = "cpu" }, { extra = "cuda128" } ],
  [ { extra = "cpu" }, { extra = "cuda130" } ],
  [ { extra = "cuda124" }, { extra = "cuda126" } ],
  [ { extra = "cuda124" }, { extra = "cuda128" } ],
  [ { extra = "cuda124" }, { extra = "cuda130" } ],
  [ { extra = "cuda126" }, { extra = "cuda128" } ],
  [ { extra = "cuda126" }, { extra = "cuda130" } ],
  [ { extra = "cuda128" }, { extra = "cuda130" } ],
]

[tool.setuptools.packages.find]
include = ["dnallm*"]

[tool.setuptools.package-data]
"dnallm" = ["*.yaml", "*.yml", "*.json"]
# Forward scaffolding: the IA³ per-model preset YAMLs land in
# dnallm/configuration/presets/ with the next trainer phase; until then this
# glob matches nothing and ships no files.
"dnallm.configuration" = ["presets/*.yaml"]

[project.scripts]
dnallm = "dnallm.cli.cli:cli"
dnallm-train = "dnallm.cli.train:main"
dnallm-inference = "dnallm.cli.inference:main"
dnallm-model-config-generator = "dnallm.cli.model_config_generator:main"
dnallm-mcp-server = "dnallm.mcp.server:main"
dnallm-mutagenesis = "dnallm.cli.mutagenesis:main"
dnallm-vep = "dnallm.cli.vep:main"

# Ruff configuration
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "example",
    "site",
    "htmlcov",
    "*.egg-info",
    "dnallm/tasks/metrics/",
    ".claude",
    ".planning",
    "dnallm/models/special/mamba_npu.py",
    "dnallm/finetune/megatron.py",
]

# Same as Black.
line-length = 100
indent-width = 4

# Assume Python 3.11+
target-version = "py311"

# Enable preview features
preview = true

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E4",   # pycodestyle errors
    "E7",   # pycodestyle errors
    "E9",   # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RUF",  # Ruff-specific rules
]

ignore = [
    "print",  # print found
    "p-print",  # pprint found
    "float-equality-comparison",  # float equality comparison (too strict for tests)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*.py" = [
    "assert",  # assert
    "hardcoded-password-func-arg",  # hardcoded password
    "hardcoded-temp-file",  # hardcoded temp file
    "magic-value-comparison",  # magic value
    "relative-imports",  # relative imports
    "unused-import",  # unused imports
    "undefined-local-with-import-star",  # star imports
    "unused-variable",  # unused variables
]
"**/tests/**/*.py" = [
    "assert",  # assert
    "hardcoded-password-func-arg",  # hardcoded password
    "hardcoded-temp-file",  # hardcoded temp file
    "magic-value-comparison",  # magic value
    "relative-imports",  # relative imports
    "unused-import",  # unused imports
    "undefined-local-with-import-star",  # star imports
    "unused-variable",  # unused variables
]

# Allow magic values in default arguments
"**/migrations/*.py" = ["magic-value-comparison"]
"dnallm/models/modeling_auto.py" = ["line-too-long"]
"tests/conftest.py" = ["hardcoded-password-string"]  # mock tokenizer special tokens are not passwords

[tool.ruff.lint.isort]
known-first-party = ["dnallm"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# ty (astral) — the sole type gate since 2026-10-17 (D-09 flip; mypy retired) —
# vendored-code excludes kept so flagless
# `uvx ty check dnallm/` reports first-party diagnostics only. Gitignore-style
# globs anchored at the project root. Deliberately no [[tool.ty.overrides]]
# severity changes: every remaining diagnostic must stay visible signal.
[tool.ty.src]
exclude = [
    "dnallm/tasks/metrics/**",
    "dnallm/models/special/mamba_npu.py",
    "dnallm/finetune/megatron.py",
]

[tool.pytest.ini_options]
testpaths = ["tests", "dnallm/mcp/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--asyncio-mode=auto",
    "--timeout=300"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "pdf: marks tests that generate PDF files",
    "performance: marks performance-related tests",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "inference: marks inference-related tests",
    "utils: marks utility function tests",
    "data: marks data handling tests",
    "legacy: marks tests for legacy/deprecated features",
    "giants: marks giant-model (evo-class) execution tests excluded from the example-nightly census by owner policy (deselect with '-m \"not giants\"')"
]
console_output_style = "progress"
minversion = "8.4"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:co_lnotab is deprecated, use co_lines instead:DeprecationWarning"
]

# Coverage configuration
[tool.coverage.run]
source_pkgs = ["dnallm"]
omit = [
    "*/dnallm/tasks/metrics/*",                    # vendored HF evaluate
    "*/dnallm/models/special/enformer_model/*",    # ported Enformer
    "*/dnallm/finetune/megatron.py",               # unimportable adapter
    "*/dnallm/models/special/mamba_npu.py",        # unimportable adapter
    "*/dnallm/mcp/tests/*",                        # packaged test files
    "*/dnallm/mcp/run_tests.py",                   # helper script
    "*/dnallm/mcp/example_sse_usage.py",           # example script
]

[tool.coverage.report]
show_missing = true
fail_under = 90   # Phase 4 ratchet (GATE-01) — the floor, never the achievement.
                  # Fast-lane suite measured 96.72% at the v1.2 closeout (2026-10-10;
                  # was 96.30% at Phase 3) — the Phase 11/12 modules moved the number.
                  # Applies to every `--cov` invocation — use `--no-cov` for scoped runs.
